<style>
/* כיוון: כלי עבודה פיננסי נקי. ירוק-יער עמוק כמותג, ורוד-פרחוני עדין כנגיעה, ירוק/אדום רק למשמעות כספית. */
:root{
  --bg:#f4f5f3;--surface:#ffffff;--surface-2:#f8f9f7;--ink:#14201a;--muted:#6b756f;--line:#e3e7e3;--line-2:#eef1ee;
  --brand:#1e3a2f;--brand-ink:#ffffff;--brand-soft:#e6eee9;--rose:#c9798a;--rose-soft:#f7e9ec;
  --green:#15803d;--green-bg:#eaf6ee;--red:#c2410c;--red2:#dc2626;--red-bg:#fdeeee;--warn:#a16207;--warn-bg:#fdf4dc;
  --shadow:0 1px 2px rgba(20,32,26,.04),0 4px 14px rgba(20,32,26,.05);
  --r:16px;--r-s:10px;
  --f-display:"Rubik","Heebo",system-ui,sans-serif;--f-body:"Heebo",-apple-system,"Segoe UI",Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1512;--surface:#171f1b;--surface-2:#1c2520;--ink:#e8eee9;--muted:#93a199;--line:#27322c;--line-2:#212b26;
  --brand:#3f7a5f;--brand-soft:#1f2e27;--rose:#e29aaa;--rose-soft:#2c1f23;
  --green:#4ade80;--green-bg:#15281d;--red2:#f87171;--red-bg:#2e1a1a;--warn:#fbbf24;--warn-bg:#2b2412;
  --shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1512;--surface:#171f1b;--surface-2:#1c2520;--ink:#e8eee9;--muted:#93a199;--line:#27322c;--line-2:#212b26;
  --brand:#3f7a5f;--brand-soft:#1f2e27;--rose:#e29aaa;--rose-soft:#2c1f23;
  --green:#4ade80;--green-bg:#15281d;--red2:#f87171;--red-bg:#2e1a1a;--warn:#fbbf24;--warn-bg:#2b2412;
  --shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
.num,.amt,.stat .v,td.n{font-variant-numeric:tabular-nums}
/* מבנה */
.shell{min-height:100%}
header.top{position:sticky;top:0;z-index:5;background:var(--brand);color:var(--brand-ink);padding:calc(12px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 12px calc(16px + env(safe-area-inset-left));display:flex;align-items:center;gap:12px}
.logo{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.12);display:grid;place-items:center;flex:0 0 38px}
.logo svg{width:22px;height:22px}
.brandtxt{flex:1;min-width:0}
.brandtxt h1{font-family:var(--f-display);font-size:17px;margin:0;font-weight:600;letter-spacing:-.01em}
.brandtxt small{opacity:.72;font-size:12px}
.sync{font-size:11.5px;display:flex;align-items:center;gap:6px;opacity:.85;white-space:nowrap}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:#86efac}
.top .add{display:none}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;border:0;background:none;padding:9px 2px 8px;font:inherit;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;border-radius:0}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--brand);font-weight:600}
nav.tabs button.on svg{stroke-width:2.1}
main{max-width:1040px;margin:0 auto;padding:18px 16px 150px}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:2px 2px 14px}
.pagehead h2{margin:0;font-size:22px}
.pagehead .sub{color:var(--muted);font-size:13px}
@media(min-width:900px){
  .shell{display:grid;grid-template-columns:240px 1fr;grid-template-rows:auto 1fr}
  header.top{grid-column:1/-1}
  .top .add{display:inline-flex}
  nav.tabs{position:sticky;top:62px;align-self:start;flex-direction:column;border:0;border-inline-end:1px solid var(--line);background:transparent;padding:18px 12px;gap:2px;height:calc(100vh - 62px)}
  nav.tabs button{flex:0 0 auto;flex-direction:row;justify-content:flex-start;gap:12px;font-size:14.5px;padding:10px 12px;border-radius:10px;color:var(--ink)}
  nav.tabs button:hover{background:var(--surface-2)}
  nav.tabs button.on{background:var(--brand-soft);color:var(--brand)}
  main{padding:26px 28px 60px;margin:0;max-width:1040px;width:100%}
  .fab{display:none}
}
/* טיפוגרפיה */
h2,h3{font-family:var(--f-display);text-wrap:balance;letter-spacing:-.01em}
h2{font-size:16px;font-weight:600;margin:24px 2px 10px}
h3{font-size:15px;font-weight:600;margin:0 0 8px}
.sec{display:flex;align-items:center;justify-content:space-between;margin:24px 2px 10px}
.sec h2{margin:0}
/* כרטיסים */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grid{display:grid;gap:10px}
.grid>*{min-width:0}
.g2{grid-template-columns:1fr 1fr}
.g4{grid-template-columns:repeat(2,1fr)}
@media(min-width:700px){.g4{grid-template-columns:repeat(4,1fr)}}
/* מספרי מפתח */
.stat{position:relative;border-radius:var(--r);padding:14px 14px 13px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden}
.stat::before{content:"";position:absolute;inset-block:0;inset-inline-start:0;width:3px;background:var(--line)}
.stat .l{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:7px;font-weight:500}
.stat .ic{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;background:var(--surface-2)}
.stat .ic svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.stat .v{font-family:var(--f-display);font-size:22px;font-weight:600;margin-top:8px;direction:ltr;text-align:right;letter-spacing:-.02em}
.stat.in::before{background:var(--green)}.stat.in .ic{background:var(--green-bg);color:var(--green)}.stat.in .v{color:var(--green)}
.stat.out::before{background:var(--red2)}.stat.out .ic{background:var(--red-bg);color:var(--red2)}.stat.out .v{color:var(--red2)}
.stat.net{background:var(--brand);border-color:var(--brand);color:#fff}
.stat.net::before{display:none}
.stat.net .l{color:rgba(255,255,255,.75)}.stat.net .ic{background:rgba(255,255,255,.14);color:#fff}
.stat.net .v{color:#fff}
.stat.net .v.neg{color:#fecaca}
.pos{color:var(--green)}.neg{color:var(--red2)}
/* כפתורים וטפסים */
button,.btn{font:inherit;font-size:14.5px;border-radius:var(--r-s);border:1px solid var(--line);background:var(--surface);padding:9px 14px;cursor:pointer;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:background .15s,border-color .15s}
button:hover{border-color:#c9d0ca}
button:focus-visible,input:focus-visible,select:focus-visible,.chip:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
.btn-p{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.btn-p:hover{filter:brightness(1.1);border-color:var(--brand)}
.btn-g{background:var(--green);border-color:var(--green);color:#fff;font-weight:600}
.btn-r{background:var(--red2);border-color:var(--red2);color:#fff;font-weight:600}
.btn-s{padding:6px 11px;font-size:13px}
.btn-x{border:0;background:none;color:var(--muted);padding:4px 6px}
.btn-x:hover{color:var(--ink)}
.btn svg,button svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
input,select,textarea{font:inherit;font-size:16px;border:1px solid var(--line);border-radius:var(--r-s);padding:10px 11px;background:var(--surface);color:var(--ink);width:100%;min-height:44px}
input:focus,select:focus{border-color:var(--brand);outline:none;box-shadow:0 0 0 3px var(--brand-soft)}
input[type=date]{min-width:0;-webkit-appearance:none;appearance:none}
label{display:block;font-size:12.5px;color:var(--muted);margin:10px 0 5px;font-weight:500}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13.5px;cursor:pointer;user-select:none}
.chip:hover{border-color:#c9d0ca}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.chip.in.on{background:var(--green);border-color:var(--green);color:#fff}
.chip.out.on{background:var(--red2);border-color:var(--red2);color:#fff}
/* רשימות */
.list{padding:4px 14px}
.list .it{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line-2)}
.list .it:last-child{border-bottom:0}
.list .it.click{cursor:pointer}
.list .it.click:hover .t{color:var(--brand)}
.av{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;flex:0 0 36px;background:var(--surface-2);color:var(--muted);font-weight:600;font-family:var(--f-display)}
.av svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.av.in{background:var(--green-bg);color:var(--green)}.av.out{background:var(--red-bg);color:var(--red2)}
.av.sup{background:var(--rose-soft);color:var(--rose)}
.it .main{flex:1;min-width:0}
.it .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .s{font-size:12.5px;color:var(--muted);margin-top:2px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.it.total{background:var(--surface-2);margin:0 -14px;padding:12px 16px;border-radius:0 0 var(--r) var(--r)}
.amt{font-weight:600;direction:ltr;white-space:nowrap;font-family:var(--f-display)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:2px 9px;border-radius:999px;background:var(--brand-soft);color:var(--brand);font-weight:600}
.badge.open{background:var(--warn-bg);color:var(--warn)}
.badge.paid{background:var(--green-bg);color:var(--green)}
.muted{color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:26px 8px;font-size:14px}
.weeknav{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px;margin-bottom:12px;box-shadow:var(--shadow)}
.weeknav b{font-size:14px;font-weight:600;text-align:center;flex:1}
.weeknav button{border-radius:999px;border:0;background:var(--surface-2);width:38px;height:38px;padding:0}
.today{text-align:center;margin:-6px 0 10px}
.tbl{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 8px;border-bottom:1px solid var(--line-2);text-align:right}
th{font-size:12px;color:var(--muted);font-weight:500}
td.n{direction:ltr;text-align:left;white-space:nowrap}
tr:last-child td{border-bottom:0}
.bars{display:flex;flex-direction:column;gap:9px;margin-top:14px}
.bar{display:flex;align-items:center;gap:10px;font-size:13px}
.bar .lab{width:86px;color:var(--muted)}
.bar .trk{flex:1;background:var(--surface-2);border-radius:6px;height:12px;overflow:hidden}
.bar .fill{height:100%;border-radius:6px}
.bar .num{width:92px;direction:ltr;text-align:left;font-weight:600}
.chg{font-weight:600;white-space:nowrap}
.note{font-size:12.5px;color:var(--muted);margin:6px 2px 0}
/* דיאלוג */
dialog{border:0;border-radius:20px;padding:0;width:min(560px,94vw);max-height:90vh;box-shadow:0 24px 70px rgba(0,0,0,.28);background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(15,21,18,.5);backdrop-filter:blur(2px)}
.dlg-h{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--surface);z-index:2}
.dlg-h h3{margin:0;font-size:17px}
.dlg-b{padding:6px 18px 18px}
.dlg-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;position:sticky;bottom:0;background:var(--surface)}
.lines .ln{display:grid;grid-template-columns:1.6fr .8fr .8fr auto;gap:6px;align-items:end;margin-bottom:6px}
.lines .ln input{padding:8px}
.total-line{display:flex;justify-content:space-between;align-items:center;background:var(--surface-2);border-radius:var(--r-s);padding:12px 14px;margin-top:12px;font-weight:600}
.total-line span{font-family:var(--f-display);font-size:19px}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:8px;border-radius:9px;font-size:14px}
.seg button.on{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.1);font-weight:600}
.seg.io button.on.in{background:var(--green);color:#fff}
.seg.io button.on.out{background:var(--red2);color:#fff}
.fab{position:fixed;left:16px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:7;border-radius:999px;padding:13px 20px;box-shadow:0 8px 22px rgba(30,58,47,.35);font-size:15px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:150px;background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:50}
.toast.show{opacity:1}
.onboard{background:linear-gradient(135deg,var(--brand-soft),var(--rose-soft));border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px}
.onboard h3{font-size:17px;margin-bottom:4px}
.onboard ol{margin:10px 0 14px;padding-inline-start:20px;color:var(--ink);font-size:14px}
.onboard ol li{margin-bottom:4px}
/* ===== עיצוב זכוכית בסגנון אפל ===== */
:root{
  --f-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Rubik","Heebo",system-ui,sans-serif;
  --f-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Heebo","Segoe UI",Arial,sans-serif;
  --glass:rgba(255,255,255,.55);--glass-2:rgba(255,255,255,.38);--glass-strong:rgba(255,255,255,.72);
  --glass-line:rgba(255,255,255,.75);--glass-edge:rgba(20,40,30,.08);
  --blur:saturate(180%) blur(24px);
  --ink:#0f1a14;--muted:#5d6a63;--line:rgba(20,40,30,.10);--line-2:rgba(20,40,30,.07);
  --surface:var(--glass);--surface-2:rgba(255,255,255,.45);
  --brand:#1f4d3a;--brand-soft:rgba(31,77,58,.10);
  --green:#1a8f4a;--red2:#e0352b;--green-bg:rgba(26,143,74,.12);--red-bg:rgba(224,53,43,.11);
  --shadow:0 1px 0 rgba(255,255,255,.6) inset,0 8px 30px rgba(15,40,28,.08);
  --r:22px;--r-s:13px;
  --bg1:#a9dcc0;--bg2:#f4bccb;--bg3:#c3cdf4;--bgbase:#eaf0ec;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --glass:rgba(40,48,44,.45);--glass-2:rgba(40,48,44,.32);--glass-strong:rgba(30,38,34,.72);
  --glass-line:rgba(255,255,255,.14);--glass-edge:rgba(0,0,0,.3);
  --ink:#eef3f0;--muted:#a3b0a9;--line:rgba(255,255,255,.10);--line-2:rgba(255,255,255,.06);
  --surface:var(--glass);--surface-2:rgba(255,255,255,.07);
  --brand:#5fae88;--brand-soft:rgba(95,174,136,.16);
  --green:#4ade80;--red2:#ff6b5e;--green-bg:rgba(74,222,128,.14);--red-bg:rgba(255,107,94,.14);
  --shadow:0 1px 0 rgba(255,255,255,.08) inset,0 8px 30px rgba(0,0,0,.35);
  --bg1:#12352a;--bg2:#3a1d29;--bg3:#1b2240;--bgbase:#0b0f0d}}
:root[data-theme="dark"]{
  --glass:rgba(40,48,44,.45);--glass-2:rgba(40,48,44,.32);--glass-strong:rgba(30,38,34,.72);
  --glass-line:rgba(255,255,255,.14);--glass-edge:rgba(0,0,0,.3);
  --ink:#eef3f0;--muted:#a3b0a9;--line:rgba(255,255,255,.10);--line-2:rgba(255,255,255,.06);
  --surface:var(--glass);--surface-2:rgba(255,255,255,.07);
  --brand:#5fae88;--brand-soft:rgba(95,174,136,.16);
  --green:#4ade80;--red2:#ff6b5e;--green-bg:rgba(74,222,128,.14);--red-bg:rgba(255,107,94,.14);
  --shadow:0 1px 0 rgba(255,255,255,.08) inset,0 8px 30px rgba(0,0,0,.35);
  --bg1:#12352a;--bg2:#3a1d29;--bg3:#1b2240;--bgbase:#0b0f0d}
html,body{background:var(--bgbase);letter-spacing:-.005em}
body::before{content:"";position:fixed;inset:-10%;z-index:-1;pointer-events:none;
  background:radial-gradient(45% 40% at 85% 8%,var(--bg1),transparent 70%),
             radial-gradient(45% 40% at 10% 35%,var(--bg2),transparent 70%),
             radial-gradient(55% 50% at 70% 80%,var(--bg3),transparent 70%),
             radial-gradient(35% 30% at 20% 90%,var(--bg1),transparent 70%),var(--bgbase)}
/* רכיב זכוכית משותף */
.card,.stat,.weeknav,header.top,nav.tabs,dialog,.onboard,input,select,button:not(.btn-x):not(.chip),.chip,.seg,.fab,.toast{
  -webkit-backdrop-filter:var(--blur);backdrop-filter:var(--blur)}
.card,.stat,.weeknav,.onboard{background:var(--glass);border:1px solid var(--glass-line);box-shadow:var(--shadow)}
.card{border-radius:var(--r)}
/* כותרת: זכוכית צפה */
header.top{background:var(--glass-strong);color:var(--ink);border-bottom:1px solid var(--glass-line);box-shadow:0 1px 0 var(--glass-edge)}
.logo{background:linear-gradient(145deg,#2f7a58,#1f4d3a);box-shadow:0 4px 12px rgba(31,77,58,.35),inset 0 1px 0 rgba(255,255,255,.35)}
.brandtxt small{opacity:1;color:var(--muted)}
.sync{opacity:1;color:var(--muted)}
.sync::before{background:#34c759;box-shadow:0 0 0 3px rgba(52,199,89,.18)}
.top .add{background:var(--brand)!important;color:#fff;border-radius:999px}
/* סרגל תחתון צף (כמו iOS) */
nav.tabs{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));padding:6px;border-radius:26px;background:var(--glass-strong);border:1px solid var(--glass-line);box-shadow:0 10px 40px rgba(15,40,28,.18),inset 0 1px 0 rgba(255,255,255,.5)}
nav.tabs button{border-radius:20px;padding:7px 2px 6px}
nav.tabs button.on{background:var(--brand-soft);color:var(--brand)}
.fab{bottom:calc(92px + env(safe-area-inset-bottom));background:linear-gradient(145deg,#2f7a58,#1f4d3a);border:1px solid rgba(255,255,255,.25);box-shadow:0 10px 30px rgba(31,77,58,.4),inset 0 1px 0 rgba(255,255,255,.3)}
@media(min-width:900px){
  nav.tabs{left:auto;right:auto;bottom:auto;margin:18px 0 0 0;margin-inline-start:16px;height:auto;padding:10px;border-radius:24px;top:84px}
  nav.tabs button{border-radius:14px}
}
/* מספרי מפתח */
.stat{border-radius:var(--r)}
.stat::before{display:none}
.stat .ic{border-radius:9px;width:26px;height:26px}
.stat.net{background:linear-gradient(150deg,rgba(47,122,88,.92),rgba(24,62,46,.92));border:1px solid rgba(255,255,255,.28);box-shadow:0 12px 30px rgba(31,77,58,.28),inset 0 1px 0 rgba(255,255,255,.3)}
.stat .v{font-weight:700;letter-spacing:-.025em}
/* כפתורים */
button,.btn{border-radius:999px;background:var(--glass-2);border:1px solid var(--glass-line);box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
button:hover{background:var(--glass)}
.btn-p{background:linear-gradient(145deg,#2f7a58,#1f4d3a);border-color:rgba(255,255,255,.2);box-shadow:0 6px 16px rgba(31,77,58,.28),inset 0 1px 0 rgba(255,255,255,.3)}
.btn-g{background:linear-gradient(145deg,#2fb565,#16803f);border-color:rgba(255,255,255,.2);box-shadow:0 6px 16px rgba(26,143,74,.28),inset 0 1px 0 rgba(255,255,255,.3)}
.btn-r{background:linear-gradient(145deg,#f2584e,#d22b21);border-color:rgba(255,255,255,.2);box-shadow:0 6px 16px rgba(224,53,43,.26),inset 0 1px 0 rgba(255,255,255,.3)}
.btn-x{background:none!important;box-shadow:none!important;border:0!important}
.weeknav button{background:var(--glass-2);border:1px solid var(--glass-line)}
/* טפסים */
input,select,textarea{background:var(--glass-2);border:1px solid var(--glass-line);border-radius:var(--r-s);box-shadow:inset 0 1px 2px rgba(15,40,28,.05)}
input:focus,select:focus{background:var(--glass-strong);border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
.chip{background:var(--glass-2);border:1px solid var(--glass-line)}
.chip.on{background:var(--ink);color:var(--bgbase);border-color:transparent}
.seg{background:var(--glass-2);border:1px solid var(--glass-line);border-radius:14px}
.seg button{border:0;box-shadow:none;background:none;border-radius:11px}
.seg button.on{background:var(--glass-strong);box-shadow:0 2px 8px rgba(15,40,28,.12)}
/* רשימות */
.av{border-radius:12px;background:var(--glass-2);border:1px solid var(--glass-line)}
.av.in,.av.out,.av.sup{border-color:transparent}
.it.total{background:var(--glass-2)}
.total-line{background:var(--glass-2);border:1px solid var(--glass-line)}
.bar .trk{background:var(--glass-2)}
/* דיאלוגים */
dialog{background:var(--glass-strong);border:1px solid var(--glass-line);border-radius:26px;box-shadow:0 30px 80px rgba(0,0,0,.25)}
dialog::backdrop{background:rgba(10,20,15,.25);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.dlg-h,.dlg-f{background:transparent}
.dlg-h{border-bottom:1px solid var(--line)}.dlg-f{border-top:1px solid var(--line)}
.onboard{background:linear-gradient(135deg,rgba(255,255,255,.6),rgba(255,255,255,.35))}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .onboard{background:linear-gradient(135deg,rgba(95,174,136,.18),rgba(226,154,170,.12))}}
:root[data-theme="dark"] .onboard{background:linear-gradient(135deg,rgba(95,174,136,.18),rgba(226,154,170,.12))}
.toast{background:rgba(20,28,24,.78);color:#fff;border:1px solid rgba(255,255,255,.15)}
main{padding-bottom:170px}
nav.tabs button{background:none;border:0;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
nav.tabs button.on{background:var(--brand-soft)}
.weeknav button,.seg button{-webkit-backdrop-filter:none;backdrop-filter:none}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  :root{--glass:rgba(255,255,255,.92);--glass-strong:rgba(255,255,255,.97)}}

/* ===== גרסה מאופקת ומקצועית ===== */
:root{--bg1:#d3e6db;--bg2:#ece0e6;--bg3:#dde2ef;--bgbase:#eef1ef;--shadow:0 1px 2px rgba(15,40,28,.05),0 4px 16px rgba(15,40,28,.05)}
.btn-p,.fab,.logo,.top .add{background:var(--brand)!important;border-color:transparent!important;box-shadow:0 1px 2px rgba(0,0,0,.12)!important}
.fab{box-shadow:0 6px 18px rgba(0,0,0,.18)!important}
.btn-g{background:var(--green-bg);color:var(--green);border:1px solid transparent;box-shadow:none}
.btn-r{background:var(--red-bg);color:var(--red2);border:1px solid transparent;box-shadow:none}
.btn-g:hover,.btn-r:hover{filter:brightness(.97)}
.stat.net{background:var(--brand);border:1px solid transparent;box-shadow:var(--shadow)}
.stat.net .v.neg{color:#ffd1cc}
button,.btn{box-shadow:none}
nav.tabs{box-shadow:0 6px 24px rgba(15,40,28,.12)}
.sync::before{box-shadow:none}
.stat .v{font-weight:650}


:root{--brand-fill:#1f4d3a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--brand-fill:#2a6149}}
:root[data-theme="dark"]{--brand-fill:#2a6149}
.btn-p,.fab,.logo,.top .add,.stat.net{background:var(--brand-fill)!important}
.btn-p,.fab,.top .add{color:#fff}
nav.tabs button:not(.on){background:none!important;border:0!important}

:root{--btn-fill:var(--brand-fill);--btn-ink:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--brand:#e8eee9;--brand-soft:rgba(255,255,255,.10);--brand-fill:rgba(255,255,255,.10);--btn-fill:#eef2ef;--btn-ink:#111814;
  --bg1:#1a2420;--bg2:#241c20;--bg3:#1a1e2a;--bgbase:#0c0f0e}}
:root[data-theme="dark"]{--brand:#e8eee9;--brand-soft:rgba(255,255,255,.10);--brand-fill:rgba(255,255,255,.10);--btn-fill:#eef2ef;--btn-ink:#111814;
  --bg1:#1a2420;--bg2:#241c20;--bg3:#1a1e2a;--bgbase:#0c0f0e}
.btn-p,.fab,.top .add{background:var(--btn-fill)!important;color:var(--btn-ink)!important}
.stat.net{border:1px solid var(--glass-line)!important}
.logo{background:#1f4d3a!important}

@media(max-width:899px){
  nav.tabs{left:0;right:0;bottom:0;border-radius:0;background:color-mix(in srgb,var(--bgbase) 88%,transparent)!important;border:0;border-top:1px solid var(--glass-line);padding:6px 8px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 20px rgba(15,40,28,.06)}
  .fab{bottom:calc(84px + env(safe-area-inset-bottom))}
  main{padding-bottom:calc(160px + env(safe-area-inset-bottom))}
}

/* מצב כהה ניטרלי: אפור של אפל, ירוק רק איפה שהוא ירוק גם במצב הבהיר */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--surface:rgba(44,44,46,.55);--surface-2:rgba(255,255,255,.06);
  --glass:rgba(44,44,46,.55);--glass-2:rgba(255,255,255,.06);--glass-strong:rgba(28,28,30,.82);
  --glass-line:rgba(255,255,255,.10);--glass-edge:rgba(0,0,0,.4);
  --ink:#f2f2f7;--muted:#98989f;--line:rgba(255,255,255,.10);--line-2:rgba(255,255,255,.06);
  --brand:#7fc4a0;--brand-soft:rgba(127,196,160,.14);--brand-fill:#1f4d3a;--btn-fill:#1f4d3a;--btn-ink:#fff;
  --green:#4cd97b;--red2:#ff6961;--green-bg:rgba(76,217,123,.13);--red-bg:rgba(255,105,97,.13);--warn:#ffd60a;--warn-bg:rgba(255,214,10,.12);
  --rose:#e29aaa;--rose-soft:rgba(226,154,170,.14);
  --bg1:#1c1c1e;--bg2:#1c1c1e;--bg3:#1c1c1e;--bgbase:#000;
  --shadow:0 1px 0 rgba(255,255,255,.05) inset,0 8px 30px rgba(0,0,0,.45);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--surface:rgba(44,44,46,.55);--surface-2:rgba(255,255,255,.06);
  --glass:rgba(44,44,46,.55);--glass-2:rgba(255,255,255,.06);--glass-strong:rgba(28,28,30,.82);
  --glass-line:rgba(255,255,255,.10);--glass-edge:rgba(0,0,0,.4);
  --ink:#f2f2f7;--muted:#98989f;--line:rgba(255,255,255,.10);--line-2:rgba(255,255,255,.06);
  --brand:#7fc4a0;--brand-soft:rgba(127,196,160,.14);--brand-fill:#1f4d3a;--btn-fill:#1f4d3a;--btn-ink:#fff;

.logo,.login-logo{background:var(--ink)!important;box-shadow:none!important;border-radius:0!important;padding:0!important;
  -webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat}
.logo{width:46px!important;height:46px!important;flex:0 0 46px!important}
.login-logo{width:120px;height:120px;margin:0 auto 14px;display:block}

header.top{position:sticky}
.bsd{position:absolute;top:calc(3px + env(safe-area-inset-top));inset-inline-start:calc(12px + env(safe-area-inset-right));font-size:10.5px;line-height:1;color:var(--muted);font-weight:500;pointer-events:none}
header.top{padding-top:calc(16px + env(safe-area-inset-top))!important}

/* ===== שיפורי UX/נגישות (ui-ux-pro-max) ===== */
html{scroll-padding-top:90px;scroll-padding-bottom:110px}               /* focus-not-obscured */
[onclick],.chip,button,label.btn{cursor:pointer;-webkit-tap-highlight-color:transparent}
button,.chip,.it.click,.weeknav button{transition:background-color .15s ease,opacity .15s ease,transform .12s ease,box-shadow .15s ease}
button:active,.chip:active{transform:scale(.97)}                         /* press-feedback */
.it.click:active,.stat:active{opacity:.75}
.it.click:hover{background:var(--glass-2);border-radius:12px}
:focus-visible{outline:2px solid var(--brand)!important;outline-offset:2px}
.it.click:focus-visible{border-radius:12px}
/* touch-target-size ≥44px */
.chip{min-height:40px;padding:8px 15px;display:inline-flex;align-items:center}
.btn-s{min-height:40px;padding:8px 14px}
.btn-x{min-height:44px;min-width:44px}
.weeknav button{width:44px!important;height:44px!important}
nav.tabs button{min-height:52px;font-size:12px}
.badge{font-size:12px;padding:3px 10px}
.it .s{font-size:13px}
.stat .l{font-size:13px}
th{font-size:12.5px}
button:disabled{opacity:.55;cursor:default;transform:none}

nav.tabs button:not(.on){background:transparent!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important;box-shadow:none!important}

/* ===== מערכת עיצוב אחידה (ui-styling) ===== */
:root{--radius-sm:10px;--radius:14px;--radius-lg:20px;--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-6:24px;--space-8:32px}
.card,.stat,.onboard{border-radius:var(--radius-lg)}
input,select,textarea,.total-line,.seg{border-radius:var(--radius)}
.card{padding:var(--space-4)}
h2,.sec{margin:var(--space-6) 2px var(--space-3)}
.pagehead{margin-bottom:var(--space-4)}
.grid{gap:var(--space-3)}
.row{gap:var(--space-2)}
/* empty state */
.empty-state{display:flex;flex-direction:column;align-items:center;text-align:center;gap:var(--space-2);padding:var(--space-8) var(--space-4)}
.es-ic{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--glass-2);border:1px solid var(--glass-line);color:var(--muted)}
.es-ic svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.es-t{font-weight:600;font-size:15px}
.es-d{color:var(--muted);font-size:13.5px;max-width:30ch}
.empty-state .btn-p{margin-top:var(--space-2)}
/* skeleton */
.sk-wrap{display:flex;flex-direction:column;gap:var(--space-2);padding-top:var(--space-2)}
.sk{background:linear-gradient(90deg,var(--glass-2),var(--glass-strong),var(--glass-2));background-size:200% 100%;border-radius:8px;animation:sk 1.4s ease-in-out infinite}
@keyframes sk{0%{background-position:100% 0}100%{background-position:-100% 0}}

dialog .toast{position:absolute;bottom:auto;top:66px;left:14px;right:14px;transform:none;max-width:none;border-radius:14px;padding:12px 16px;text-align:center;font-size:14.5px;z-index:100;box-shadow:0 8px 24px rgba(0,0,0,.3)}


/* מסך כניסה: ממורכז, בלי כפתורים של המערכת */
body.is-login .shell{display:block}
body.is-login main{max-width:440px!important;margin:0 auto!important;padding-top:40px}
body.is-login .top .add,body.is-login #sync,body.is-login .fab{display:none!important}
body.is-login .login-title{white-space:nowrap}
@media (prefers-reduced-motion:reduce){.sk{animation:none}}
/* table: shadcn-style header */
table thead th,table tr:first-child th{background:var(--glass-2);font-weight:600}
table tr:first-child th:first-child{border-start-start-radius:var(--radius-sm);border-end-start-radius:var(--radius-sm)}
table tr:first-child th:last-child{border-start-end-radius:var(--radius-sm);border-end-end-radius:var(--radius-sm)}
tbody tr:hover td,table tr:not(:first-child):hover td{background:var(--glass-2)}
/* dialog footer: primary action first (RTL right) and consistent sizes */
.dlg-f button{min-height:44px}
.dlg-f .btn-p,.dlg-f .btn-g,.dlg-f .btn-r{min-width:110px}
@media (prefers-reduced-motion:reduce){button:active,.chip:active{transform:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<body>
<div class="shell">
<header class="top">
  <span class="bsd" aria-label="בסייעתא דשמיא">בס״ד</span>
  <div class="logo" role="img" aria-label="הפרח בגני"></div>
  <div class="brandtxt"><h1>ניהול פיננסי - הפרח בגני</h1><small id="hdate"></small></div>
  <span class="sync" id="sync">שמור במכשיר</span>
  <button class="btn-p add" onclick="quickAdd()">+ רישום חדש</button>
</header>
<nav class="tabs" id="tabs" aria-label="ניווט ראשי"></nav>
<main id="app"></main>
</div>
<button class="btn-p fab" id="fab">+ רישום חדש</button>
<dialog id="dlg"></dialog>
<dialog id="ask" style="width:min(400px,90vw)"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ============ נתונים ============ */
const METHODS=["ביט","פייבוקס","מזומן","אשראי","העברה בנקאית"];
const INCOME_KINDS=["סכום יומי","סכום שבועי","הזמנה בודדת"];
const EXP_CATS=["חד־פעמית","סחורה (לא דרך תעודה)","תיקונים","פרסום","דלק/משלוחים","אחר"];
const KEY="flowerShopData_v1";
let S={suppliers:[],notes:[],tx:[],fixed:[],periods:[]};
let db=null,docRef=null;

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function money(n){n=Math.round((+n||0)*100)/100;return "₪"+n.toLocaleString("he-IL",{maximumFractionDigits:2})}
function sMoney(n){return (n<0?"-":"")+money(Math.abs(n))}
function today(){const d=new Date();return iso(d)}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function pd(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function addDays(s,n){const d=pd(s);d.setDate(d.getDate()+n);return iso(d)}
function weekStart(s){const d=pd(s);d.setDate(d.getDate()-d.getDay());return iso(d)}
function fmtD(s){if(!s)return"";const [y,m,d]=s.split("-");return `${+d}.${+m}.${y.slice(2)}`}
const MONTHS=["ינואר","פברואר","מרץ","אפריל","מאי","יוני","יולי","אוגוסט","ספטמבר","אוקטובר","נובמבר","דצמבר"];

function ask(msg){return new Promise(res=>{const d=document.getElementById("ask");
  d.innerHTML=`<div class="dlg-b" style="padding-top:18px"><p style="margin:0 0 6px;font-size:15.5px">${esc(msg)}</p></div><div class="dlg-f"><button class="btn-r" id="askY">אישור</button><button id="askN">ביטול</button></div>`;
  d.querySelector("#askY").onclick=()=>{d.close();res(true)};d.querySelector("#askN").onclick=()=>{d.close();res(false)};d.oncancel=()=>res(false);d.showModal()})}
function toast(t,long){const e=document.getElementById("toast");
  /* אם חלון פתוח, ההודעה עוברת לתוכו כדי שתופיע מעליו ולא מאחוריו */
  const open=[document.getElementById("ask"),document.getElementById("dlg")].find(d=>d&&d.open);
  const host=open||document.body;if(e.parentNode!==host)host.appendChild(e);
  e.textContent=t;e.classList.add("show");clearTimeout(e._t);
  e._t=setTimeout(()=>{e.classList.remove("show");setTimeout(()=>{if(!e.classList.contains("show")&&e.parentNode!==document.body)document.body.appendChild(e)},300)},long?3200:Math.max(1800,t.length*70))}

function loadLocal(){try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}}
let saveT=null;
function save(){
  S._at=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  if(FB.ref){clearTimeout(FB.t);FB.t=setTimeout(()=>{setSync("שומר…");FB.ref.set({json:JSON.stringify(S),at:S._at,by:FB.phone}).then(()=>setSync("מסונכרן")).catch(()=>setSync("לא נשמר בענן"))},500)}
  if(docRef){clearTimeout(saveT);saveT=setTimeout(async()=>{try{await docRef.set({json:JSON.stringify(S),at:Date.now()});setSync("מסונכרן בענן")}catch(e){setSync("שמור במכשיר")}},600)}
}
function setSync(t){document.getElementById("sync").textContent=t}

async function initCloud(){
  try{
    if(!window.claude||!window.claude.use)return;
    const [d,u]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!d||!u)return;
    const id=await u.id(); if(!id)return;
    db=d; docRef=db.collection("data/users/"+id).doc("state");
    const snap=await docRef.get();
    let data=snap&&(typeof snap.data==="function"?snap.data():(snap.data??snap));
    if(data&&data.json){const cloud=JSON.parse(data.json);
      const localCount=S.notes.length+S.tx.length+S.suppliers.length;
      const cloudCount=(cloud.notes||[]).length+(cloud.tx||[]).length+(cloud.suppliers||[]).length;
      if(cloudCount>=localCount){S=Object.assign({suppliers:[],notes:[],tx:[],fixed:[],periods:[]},cloud);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){} render()}
      else save();
    } else if(S.notes.length+S.tx.length+S.suppliers.length) save();
    setSync("מסונכרן בענן");
  }catch(e){}
}

/* ============ חישובים ============ */
function noteTotal(n){return n.mode==="items"?n.items.reduce((a,i)=>a+(+i.qty||0)*(+i.price||0),0):(+n.total||0)}
function supName(id){const s=S.suppliers.find(x=>x.id===id);return s?s.name:"ספק נמחק"}
/* הוצאות קבועות -> רישומים וירטואליים לכל חודש */
function fixedEntries(from,to){
  const out=[];
  for(const f of S.fixed){
    if(!f.start)continue;
    let d=pd(f.start.slice(0,7)+"-01");const end=pd(to);
    while(d<=end){
      const day=Math.min(+f.day||1,new Date(d.getFullYear(),d.getMonth()+1,0).getDate());
      const ds=iso(new Date(d.getFullYear(),d.getMonth(),day));
      if(ds>=from&&ds<=to&&ds>=f.start&&(!f.end||ds<=f.end))
        out.push({id:"fx_"+f.id+"_"+ds,type:"expense",date:ds,amount:+f.amount||0,method:f.method,cat:"הוצאה קבועה",desc:f.name,virtual:true,fixedId:f.id});
      d=new Date(d.getFullYear(),d.getMonth()+1,1);
    }
  }
  return out;
}
/* כל התנועות הכספיות (לפי אמצעי תשלום) */
function ledger(from,to){
  const rows=S.tx.filter(t=>t.date>=from&&t.date<=to).map(t=>({...t}));
  rows.push(...fixedEntries(from,to));
  for(const n of S.notes) if(n.status==="paid"&&n.paidDate>=from&&n.paidDate<=to)
    rows.push({id:"np_"+n.id,type:"expense",date:n.paidDate,amount:noteTotal(n),method:n.paidMethod,cat:"תשלום לספק",desc:"תשלום ל"+supName(n.supplierId)+(n.no?" · תעודה "+n.no:""),supplierId:n.supplierId,virtual:true,noteId:n.id});
  return rows.sort((a,b)=>b.date.localeCompare(a.date));
}
/* סיכום תקופה: הכנסות, קניות (לפי תאריך התעודה), הוצאות קבועות ושונות */
function summary(from,to){
  const inc=S.tx.filter(t=>t.type==="income"&&t.date>=from&&t.date<=to).reduce((a,t)=>a+(+t.amount||0),0);
  const other=S.tx.filter(t=>t.type==="expense"&&t.date>=from&&t.date<=to).reduce((a,t)=>a+(+t.amount||0),0);
  const fixed=fixedEntries(from,to).reduce((a,t)=>a+t.amount,0);
  const buy=S.notes.filter(n=>n.date>=from&&n.date<=to).reduce((a,n)=>a+noteTotal(n),0);
  return {inc,other,fixed,buy,exp:other+fixed+buy,net:inc-(other+fixed+buy)};
}
function qtyByItem(from,to,supplierId){
  const m={};
  for(const n of S.notes){ if(n.mode!=="items"||n.date<from||n.date>to)continue; if(supplierId&&n.supplierId!==supplierId)continue;
    for(const i of n.items){const k=(i.name||"").trim();if(!k)continue;m[k]=m[k]||{qty:0,cost:0};m[k].qty+=+i.qty||0;m[k].cost+=(+i.qty||0)*(+i.price||0)}}
  return m;
}
function allItemNames(){const s=new Set();S.suppliers.forEach(p=>Object.keys(p.prices||{}).forEach(k=>s.add(k)));S.notes.forEach(n=>(n.items||[]).forEach(i=>i.name&&s.add(i.name.trim())));return [...s].sort((a,b)=>a.localeCompare(b,"he"))}

/* ============ ניווט ============ */
const ICONS={
 home:'<svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
 list:'<svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>',
 truck:'<svg viewBox="0 0 24 24"><path d="M3 6h11v10H3zM14 9h4l3 3v4h-7"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></svg>',
 flower:'<svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="2.5"/><path d="M12 6.5c0-2 1-3.5 2.5-3.5S17 4.5 15.5 7M12 6.5C12 4.5 11 3 9.5 3S7 4.5 8.5 7M14.5 9c2 0 3.5 1 3.5 2.5S16.5 14 14 12.5M9.5 9C7.5 9 6 10 6 11.5S7.5 14 10 12.5M12 11.5V21M12 17c-2-2-4-2-5-1"/></svg>',
 cog:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>'
};
const TABS=[["home","סקירה"],["ledger","הכנסות/הוצאות"],["suppliers","ספקים"],["goods","סחורה"],["settings","קבועות"]];
const TICON={home:"home",ledger:"list",suppliers:"truck",goods:"flower",settings:"cog"};
let tab="home";
let ui={week:weekStart(today()),cmpMonth:new Date().getMonth(),cmpYear:new Date().getFullYear(),
  f:{type:"all",method:"",supplier:"",cat:"",from:addDays(today(),-30),to:today(),q:""},
  noteF:{status:"open",supplier:""},
  g:{aFrom:addDays(today(),-30),aTo:today(),bFrom:addDays(today(),-395),bTo:addDays(today(),-365),supplier:""}};

function renderTabs(){
  document.getElementById("tabs").innerHTML=TABS.map(([k,l])=>`<button class="${tab===k?"on":""}" data-tab="${k}" ${tab===k?'aria-current="page"':""}>${ICONS[TICON[k]]}<span>${l}</span></button>`).join("");
}
document.getElementById("tabs").addEventListener("click",e=>{const b=e.target.closest("button[data-tab]");if(b){tab=b.dataset.tab;render();window.scrollTo(0,0)}});
document.getElementById("fab").onclick=()=>quickAdd();

const PH={home:["סקירה","מה נכנס, מה יצא ומה נשאר"],ledger:["הכנסות והוצאות","סינון לפי אמצעי תשלום, ספק ותאריכים"],suppliers:["ספקים ותעודות משלוח","מחירונים, תעודות פתוחות ותשלומים"],goods:["מעקב סחורה","כמויות לפי פרח, תקופה מול תקופה"],settings:["הוצאות קבועות וגיבוי","נרשמות אוטומטית כל חודש"]};
function render(){renderTabs();if(!FB.cfg||FB.ref)document.getElementById("fab").style.display=(tab==="ledger"||tab==="suppliers")?"none":"";const a=document.getElementById("app");
  document.getElementById("hdate").textContent=new Date().toLocaleDateString("he-IL",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  a.innerHTML=`<div class="pagehead"><div><h2>${PH[tab][0]}</h2><div class="sub">${PH[tab][1]}</div></div></div>`+({home:vHome,ledger:vLedger,suppliers:vSuppliers,goods:vGoods,settings:vSettings})[tab]();}


const EI={ok:'<svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>',list:'<svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>',truck:'<svg viewBox="0 0 24 24"><path d="M3 6h11v10H3zM14 9h4l3 3v4h-7"/><circle cx="7" cy="18" r="2"/><circle cx="17" cy="18" r="2"/></svg>',doc:'<svg viewBox="0 0 24 24"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>',flower:'<svg viewBox="0 0 24 24"><circle cx="12" cy="9" r="2.5"/><path d="M12 11.5V21M12 17c-2-2-4-2-5-1"/></svg>',cal:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>'};
function emptyState(ic,title,desc,action){return `<div class="empty-state"><div class="es-ic">${EI[ic]}</div><div class="es-t">${title}</div>${desc?`<div class="es-d">${desc}</div>`:""}${action||""}</div>`}
function skeleton(){return `<div class="sk-wrap" aria-busy="true" aria-label="טוען"><div class="sk" style="width:40%;height:26px"></div><div class="sk" style="width:60%;height:14px"></div><div class="grid g4" style="margin-top:14px">${'<div class="sk" style="height:92px;border-radius:20px"></div>'.repeat(4)}</div><div class="sk" style="height:180px;border-radius:20px;margin-top:14px"></div></div>`}
/* ============ סקירה ============ */
const SI={in:'<svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>',out:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12l7 7 7-7"/></svg>',buy:'<svg viewBox="0 0 24 24"><path d="M3 6h11v10H3zM14 9h4l3 3v4h-7"/></svg>',net:'<svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg>'};
function st(cls,ic,l,v,vc){return `<div class="stat ${cls}"><div class="l"><span class="ic">${SI[ic]}</span>${l}</div><div class="v ${vc||""}">${v}</div></div>`}
function statBlock(s){
  return `<div class="grid g4">
${st("in","in","הכנסות",money(s.inc))}${st("out","buy","קניות מספקים",money(s.buy))}${st("out","out","הוצאות",money(s.fixed+s.other))}${st("net","net","נשאר נטו",sMoney(s.net),s.net>=0?"":"neg")}</div>`;
}
function pct(a,b){if(!b)return a?"חדש":"—";const p=(a-b)/Math.abs(b)*100;return (p>=0?"▲ ":"▼ ")+Math.abs(p).toFixed(0)+"%"}
function onboard(){
  if(S.suppliers.length||S.tx.length||S.fixed.length)return "";
  return `<div class="onboard"><h3>ברוך הבא, בוא נתחיל</h3><div class="muted" style="font-size:13.5px">שלושה צעדים וכל המספרים כבר יתחילו להופיע כאן.</div>
   <ol><li>הוסף את הספקים ואת המחירון של כל אחד</li><li>הגדר הוצאות קבועות: שכירות, פנסיה וכו׳</li><li>הזן תעודות משלוח והכנסות</li></ol>
   <div class="row"><button class="btn-p" onclick="tab='suppliers';render();supplierDialog()">+ ספק ראשון</button><button onclick="tab='settings';render();fixedDialog()">+ הוצאה קבועה</button></div></div>`}
function vHome(){
  const ws=ui.week,we=addDays(ws,6),s=summary(ws,we);
  const now=new Date(),ms=iso(new Date(now.getFullYear(),now.getMonth(),1)),me=iso(new Date(now.getFullYear(),now.getMonth()+1,0));
  const m=summary(ms,me);
  const open=S.notes.filter(n=>n.status!=="paid");
  const debt={};open.forEach(n=>debt[n.supplierId]=(debt[n.supplierId]||0)+noteTotal(n));
  const debtTot=Object.values(debt).reduce((a,b)=>a+b,0);
  // השוואה שנתית
  const y=ui.cmpYear,mo=ui.cmpMonth;
  const A=summary(iso(new Date(y,mo,1)),iso(new Date(y,mo+1,0))),B=summary(iso(new Date(y-1,mo,1)),iso(new Date(y-1,mo+1,0)));
  const mx=Math.max(A.inc,B.inc,A.exp,B.exp,1);
  const bar=(lab,v,col)=>`<div class="bar"><span class="lab">${lab}</span><div class="trk"><div class="fill" style="width:${v/mx*100}%;background:${col}"></div></div><span class="num">${money(v)}</span></div>`;
  const yrs=[];for(let i=now.getFullYear();i>=now.getFullYear()-5;i--)yrs.push(i);
  return `

async function saveFile(filename,data,mime){
  try{const dl=window.claude&&window.claude.use&&!FB.cfg?await window.claude.use("downloads"):null;
    if(dl){await dl.save({filename,data});toast("הקובץ נשמר");return}}catch(e){if(e&&e.code==="declined"){toast("ההורדה בוטלה");return}}
  const b=data instanceof Blob?data:new Blob([data],{type:mime});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000)}
/* גיבוי: קובץ אקסל קריא עם כל הנתונים, ובתוכו גיליון נסתר לשחזור */
async function exportData(){
  try{ if(!window.XLSX) await loadScript("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"); }
  catch(e){return toast("אין חיבור לאינטרנט, נסה שוב")}
  toast("מכין קובץ גיבוי…");
  const all=[...S.notes.map(n=>n.date),...S.tx.map(t=>t.date),...S.fixed.map(x=>x.start)].filter(Boolean).sort();
  const from=all[0]||today().slice(0,4)+"-01-01";
  const wb=buildWorkbook(from,today(),true);
  const d={...S};delete d._at;const json=JSON.stringify(d);
  const rows=[["נתוני שחזור, לא לערוך"]];for(let i=0;i<json.length;i+=30000)rows.push([json.slice(i,i+30000)]);
  const ws=XLSX.utils.aoa_to_sheet(rows);XLSX.utils.book_append_sheet(wb,ws,"_restore");
  wb.Workbook.Sheets=wb.SheetNames.map(n=>({name:n,Hidden:n==="_restore"?1:0}));
  const out=XLSX.write(wb,{bookType:"xlsx",type:"array",cellDates:true});
  await saveFile(`גיבוי הפרח בגני ${today()}.xlsx`,new Blob([out],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));
}

function buildWorkbook(from,to,returnWb){
  const X=window.XLSX,wb=X.utils.book_new();wb.Workbook={Views:[{RTL:true}]};
  const NF='#,##0.00 "₪"',DF="dd/mm/yyyy";
  function sheet(name,head,rows,money,widths,totalRow,dates){
    const data=[head,...rows];if(totalRow)data.push(totalRow);
    const ws=X.utils.aoa_to_sheet(data,{cellDates:true});
    ws["!cols"]=widths.map(w=>({wch:w}));
    if(rows.length)ws["!autofilter"]={ref:X.utils.encode_range({s:{r:0,c:0},e:{r:rows.length,c:head.length-1}})};
    for(let r=1;r<data.length;r++){
      for(const c of money){const a=X.utils.encode_cell({r,c});if(ws[a]&&typeof ws[a].v==="number")ws[a].z=NF}
      for(const c of (dates||[])){const a=X.utils.encode_cell({r,c});if(ws[a]&&ws[a].t==="d")ws[a].z=DF}}
    ws["!views"]=[{RTL:true}];
    X.utils.book_append_sheet(wb,ws,name);
  }
  const dd=s=>pd(s);
  // סיכום חודשי
  const months=[];let d=pd(from.slice(0,7)+"-01");const end=pd(to);
  while(d<=end){const a=iso(d),b=iso(new Date(d.getFullYear(),d.getMonth()+1,0));const m=summary(a<from?from:a,b>to?to:b);
    months.push([MONTHS[d.getMonth()]+" "+d.getFullYear(),m.inc,m.buy,m.fixed,m.other,m.exp,m.net]);d=new Date(d.getFullYear(),d.getMonth()+1,1)}
  const sm=i=>months.reduce((a,r)=>a+r[i],0);
  sheet("סיכום חודשי",["חודש","הכנסות","קניות מספקים","הוצאות קבועות","הוצאות שונות","סה״כ הוצאות","נטו"],months,[1,2,3,4,5,6],[16,14,16,16,15,15,14],["סה״כ",sm(1),sm(2),sm(3),sm(4),sm(5),sm(6)]);
  // הכנסות והוצאות
  const L=ledger(from,to).slice().reverse();
  const li=L.filter(r=>r.type==="income").reduce((a,r)=>a+r.amount,0),le=L.filter(r=>r.type==="expense").reduce((a,r)=>a+r.amount,0);
  sheet("הכנסות והוצאות",["תאריך","סוג","סכום","אמצעי תשלום","קטגוריה","תיאור","ספק"],
    L.map(r=>[dd(r.date),r.type==="income"?"הכנסה":"הוצאה",r.type==="income"?r.amount:-r.amount,r.method||"",r.cat||"",r.desc||"",r.supplierId?supName(r.supplierId):""]),[2],[12,9,13,15,18,30,14],["מאזן","",li-le],[0]);
  // לפי אמצעי תשלום
  const bym=METHODS.map(m=>{const i=L.filter(r=>r.method===m&&r.type==="income").reduce((a,r)=>a+r.amount,0),e=L.filter(r=>r.method===m&&r.type==="expense").reduce((a,r)=>a+r.amount,0);return [m,i,e,i-e]});
  sheet("לפי אמצעי תשלום",["אמצעי תשלום","נכנס","יצא","מאזן"],bym,[1,2,3],[16,14,14,14],["סה״כ",li,le,li-le]);
  // תעודות
  const N=S.notes.filter(n=>n.date>=from&&n.date<=to).sort((a,b)=>a.date.localeCompare(b.date));
  sheet("תעודות משלוח",["תאריך","ספק","מס׳ תעודה","אופן הזנה","סכום","סטטוס","שולם ב","תאריך תשלום"],
    N.map(n=>[dd(n.date),supName(n.supplierId),n.no||"",n.mode==="items"?"פריט פריט":"סכום כולל",noteTotal(n),n.status==="paid"?"שולם":"פתוחה",n.paidMethod||"",n.paidDate?dd(n.paidDate):""]),[4],[12,16,12,12,13,9,14,13],["סה״כ","","","",N.reduce((a,n)=>a+noteTotal(n),0)],[0,7]);
  // פריטים
  const IT=[];N.forEach(n=>{if(n.mode==="items")n.items.forEach(i=>IT.push([dd(n.date),supName(n.supplierId),n.no||"",i.name,+i.qty,+i.price,(+i.qty)*(+i.price)]))});
  sheet("פריטים",["תאריך","ספק","מס׳ תעודה","פריט","כמות","מחיר ליחידה","סה״כ"],IT,[5,6],[12,16,12,18,9,13,13],null,[0]);
  // כמויות
  const Q=qtyByItem(from,to);
  sheet("כמויות לפי פרח",["פריט","כמות כוללת","עלות כוללת","מחיר ממוצע"],Object.entries(Q).sort((a,b)=>b[1].qty-a[1].qty).map(([k,o])=>[k,o.qty,o.cost,o.qty?o.cost/o.qty:0]),[2,3],[18,13,14,13]);
  // חובות
  const open=S.notes.filter(n=>n.status!=="paid");const deb={};open.forEach(n=>{deb[n.supplierId]=deb[n.supplierId]||[0,0];deb[n.supplierId][0]++;deb[n.supplierId][1]+=noteTotal(n)});
  sheet("חובות לספקים",["ספק","תעודות פתוחות","סכום לתשלום"],Object.entries(deb).map(([id,[c,t]])=>[supName(id),c,t]),[2],[18,15,15],["סה״כ",open.length,open.reduce((a,n)=>a+noteTotal(n),0)]);
  // קבועות
  sheet("הוצאות קבועות",["שם","סכום חודשי","יום בחודש","אמצעי תשלום","מתאריך","עד תאריך"],S.fixed.map(f=>[f.name,+f.amount,+f.day,f.method,f.start?dd(f.start):"",f.end?dd(f.end):""]),[1],[20,14,11,15,12,12],null,[4,5]);
  if(returnWb)return wb;
  return X.write(wb,{bookType:"xlsx",type:"array",cellDates:true});
}
async function importData(inp){const f=inp.files[0];if(!f)return;inp.value="";
  let d=null;
  try{
    if(/\.json$/i.test(f.name)){d=JSON.parse(await f.text())}
    else{
      if(!window.XLSX) await loadScript("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js");
      const wb=XLSX.read(await f.arrayBuffer(),{type:"array"});const ws=wb.Sheets["_restore"];
      if(!ws)throw 0;
      const rows=XLSX.utils.sheet_to_json(ws,{header:1});d=JSON.parse(rows.slice(1).map(r=>r[0]||"").join(""));
    }
    if(!d||!d.notes||!d.tx)throw 0;
  }catch(e){return toast("הקובץ הזה לא קובץ גיבוי של המערכת",1)}
  if(!await ask("השחזור יחליף את כל הנתונים הנוכחיים. להמשיך?"))return;
  S=Object.assign({suppliers:[],notes:[],tx:[],fixed:[],periods:[]},d);save();render();toast("הנתונים שוחזרו");
}

  openDlg("סימון תשלום לספק",`<p style="margin:10px 0">${ns.length>1?ns.length+" תעודות של ":"תעודה של "}<b>${esc(supName(ns[0].supplierId))}</b> · <b class="neg">${money(tot)}</b></p>
   <label>באיזה אמצעי שולם?</label>${methodSel("pM","העברה בנקאית")}<label>תאריך תשלום</label><input id="pD" type="date" value="${today()}">`,
   `<button class="btn-g" onclick="markPaid(${JSON.stringify(ids).replace(/"/g,"'")})">סמן שולם</button><button onclick="dlg.close()">ביטול</button>`);
}
function markPaid(ids){const m=v("pM"),d=v("pD")||today();ids.forEach(id=>{const n=S.notes.find(x=>x.id===id);n.status="paid";n.paidMethod=m;n.paidDate=d});save();dlg.close();render();toast("סומן כשולם")}

function fixedDialog(id){
  const f=id?S.fixed.find(x=>x.id===id):null;
  openDlg(f?"עריכת הוצאה קבועה":"הוצאה קבועה חדשה",`<label>שם</label><input id="fN" value="${f?esc(f.name):""}">
   <div class="grid g2"><div><label>סכום חודשי (₪)</label><input id="fA" type="number" inputmode="decimal" value="${f?f.amount:""}"></div><div><label>יום בחודש</label><input id="fDay" type="number" min="1" max="31" value="${f?f.day:1}"></div></div>
   <label>אמצעי תשלום</label>${methodSel("fM",f?f.method:"העברה בנקאית")}
   <div class="grid g2"><div><label>מתחיל מ־</label><input id="fS" type="date" value="${f?f.start:today().slice(0,8)+"01"}"></div><div><label>מסתיים (לא חובה)</label><input id="fE" type="date" value="${f?f.end||"":""}"></div></div>`,
   `<button class="btn-p" onclick="saveFixed('${id||""}')">שמירה</button><button onclick="dlg.close()">ביטול</button>${f?`<button class="btn-x" style="margin-inline-start:auto;color:var(--red)" onclick="delFixed('${id}')">מחיקה</button>`:""}`);
}
function saveFixed(id){const name=v("fN").trim(),amount=parseFloat(v("fA"));if(!name||!(amount>0))return toast("נא להזין שם וסכום");
  const o={name,amount,day:Math.min(31,Math.max(1,+v("fDay")||1)),method:v("fM"),start:v("fS")||today(),end:v("fE")||""};
  if(id)Object.assign(S.fixed.find(x=>x.id===id),o);else S.fixed.push({id:uid(),...o});save();dlg.close();render();toast("נשמר")}
async function delFixed(id){if(!await ask("למחוק? (אם ההוצאה הפסיקה, עדיף להגדיר תאריך סיום כדי לשמור את ההיסטוריה)"))return;S.fixed=S.fixed.filter(x=>x.id!==id);save();dlg.close();render()}

function periodDialog(){openDlg("שמירת תקופה / חג",`<label>שם</label><input id="peN">
  <div class="grid g2"><div><label>מתאריך</label><input id="peF" type="date" value="${ui.g.aFrom}"></div><div><label>עד תאריך</label><input id="peT" type="date" value="${ui.g.aTo}"></div></div>`,
  `<button class="btn-p" onclick="savePeriod()">שמירה</button><button onclick="dlg.close()">ביטול</button>`)}
function savePeriod(){const n=v("peN").trim(),f=v("peF"),t=v("peT");if(!n||!f||!t)return toast("נא למלא שם ותאריכים");S.periods.push({id:uid(),name:n,from:f,to:t});save();dlg.close();render();toast("התקופה נשמרה")}

/* ============ התחברות עם מספר טלפון (Firebase) ============
   כדי להפעיל: מלא את FIREBASE_CONFIG ואת OWNER_PHONE (ראה הוראות בקובץ README).
   כל עוד FIREBASE_CONFIG ריק, האתר עובד בלי התחברות והנתונים נשמרים במכשיר. */
const FIREBASE_CONFIG={apiKey:"AIzaSyBxr2pJROTBewNaUcRvmzdxQfMjNjCa_ZA",authDomain:"haperach-begani.firebaseapp.com",projectId:"haperach-begani",storageBucket:"haperach-begani.firebasestorage.app",messagingSenderId:"734936242091",appId:"1:734936242091:web:8d67b6f0693641119964ee"}; // הדבק כאן: {apiKey:"...",authDomain:"...",projectId:"...",appId:"..."}
const OWNER_PHONE="0522418556";        // מספר הטלפון של רון, למשל "0541234567"
const FB={cfg:FIREBASE_CONFIG,ref:null,phone:"",owner:false,access:{phones:[]},t:null};

function normPhone(p){let d=String(p||"").replace(/\D/g,"");if(d.startsWith("972"))d=d.slice(3);if(d.startsWith("0"))d=d.slice(1);return d?"972"+d:""}
function prettyPhone(p){const d=normPhone(p);if(!d)return"";const l="0"+d.slice(3);return l.slice(0,3)+"-"+l.slice(3)}
function phoneEmail(p){return normPhone(p)+"@phone.flowershop"}

async function fbStart(){
  document.getElementById("app").innerHTML=skeleton();
  const base="https://www.gstatic.com/firebasejs/10.12.2/";
  try{for(const f of ["firebase-app-compat.js","firebase-auth-compat.js","firebase-firestore-compat.js"])await loadScript(base+f)}
  catch(e){document.getElementById("app").innerHTML=`<div class="card empty">אין חיבור לאינטרנט. בדוק את החיבור ורענן את הדף.</div>`;return}
  firebase.initializeApp(FIREBASE_CONFIG);
  firebase.auth().setPersistence(firebase.auth.Auth.Persistence.LOCAL);
  firebase.auth().onAuthStateChanged(onAuth);
}
function loginView(err){
  const _p=(document.getElementById("lgP")||{}).value||"",_k=(document.getElementById("lgK")||{}).value||"";
  document.body.classList.add("is-login");
  document.getElementById("tabs").style.display="none";document.getElementById("fab").style.display="none";
  document.getElementById("app").innerHTML=`<div style="max-width:400px;margin:30px auto">
   <div class="card" style="padding:24px">
    <div class="login-logo" role="img" aria-label="הפרח בגני"></div>
    <h2 class="login-title" style="margin:0 0 4px;font-size:22px;text-align:center">ניהול פיננסי - הפרח בגני</h2>
    <p class="muted" style="margin:0 0 8px;font-size:13.5px;text-align:center">רק מספרים שבעל העסק אישר יכולים להיכנס.</p>
    <label for="lgP">מספר טלפון</label><input id="lgP" type="tel" inputmode="tel" autocomplete="username" placeholder="050-0000000" style="direction:ltr;text-align:right" value="${esc(_p)}">
    <label for="lgK">סיסמה</label><input id="lgK" type="password" autocomplete="current-password" placeholder="לפחות 6 תווים" value="${esc(_k)}">
    ${err?`<p class="neg" style="font-size:13.5px;margin:10px 0 0">${esc(err)}</p>`:""}
    <button class="btn-p" style="width:100%;margin-top:14px;min-height:46px" onclick="doLogin()">כניסה</button>
    <button style="width:100%;margin-top:10px;min-height:46px" onclick="doRegister()">פעם ראשונה? יצירת סיסמה למספר שלי</button>
   </div></div>`;
}
async function doLogin(){const p=v("lgP"),k=v("lgK");if(!normPhone(p)||normPhone(p).length<11)return loginView("מספר הטלפון לא תקין");
  try{await firebase.auth().signInWithEmailAndPassword(phoneEmail(p),k)}catch(e){loginView(e.code==="auth/too-many-requests"?"יותר מדי ניסיונות. נסה שוב בעוד כמה דקות.":"מספר או סיסמה שגויים. אם זו הכניסה הראשונה, לחץ על \"פעם ראשונה? יצירת סיסמה\".")}}
async function doRegister(){const p=v("lgP"),k=v("lgK");if(!normPhone(p)||normPhone(p).length<11)return loginView("מספר הטלפון לא תקין");if(k.length<6)return loginView("הסיסמה צריכה להיות לפחות 6 תווים");
  try{await firebase.auth().createUserWithEmailAndPassword(phoneEmail(p),k)}catch(e){loginView(e.code==="auth/email-already-in-use"?"למספר הזה כבר יש סיסמה. לחץ על כניסה.":"לא הצלחנו ליצור חשבון. נסה שוב.")}}
async function logout(){if(!await ask("להתנתק מהמערכת?"))return;await firebase.auth().signOut()}

let fbUnsub=null;
async function onAuth(u){
  if(fbUnsub){fbUnsub();fbUnsub=null}
  if(!u){FB.ref=null;S={suppliers:[],notes:[],tx:[],fixed:[],periods:[]};return loginView()}
  FB.phone=u.email.split("@")[0];FB.owner=FB.phone===normPhone(OWNER_PHONE);
  const fs=firebase.firestore();
  try{const a=await fs.doc("config/access").get();FB.access=a.exists?a.data():{phones:[]}}catch(e){FB.access={phones:[]}}
  if(!FB.owner&&!(FB.access.phones||[]).includes(FB.phone)){
    loginView(`למספר ${prettyPhone(FB.phone)} אין הרשאה. בקש מבעל העסק להוסיף אותו, ואז היכנס שוב.`);
    return firebase.auth().signOut().then(()=>loginView(`למספר ${prettyPhone(FB.phone)} אין הרשאה. בקש מבעל העסק להוסיף אותו, ואז היכנס שוב.`));
  }
  document.body.classList.remove("is-login");document.getElementById("tabs").style.display="";document.getElementById("fab").style.display="";
  FB.ref=fs.doc("shops/main");
  let first=true;
  fbUnsub=FB.ref.onSnapshot(snap=>{
    if(snap.metadata.hasPendingWrites)return;
    const d=snap.exists?snap.data():null;
    if(d&&d.json&&(first||d.at>(S._at||0))){S=Object.assign({suppliers:[],notes:[],tx:[],fixed:[],periods:[]},JSON.parse(d.json));S._at=d.at;
      if(!first&&d.by!==FB.phone)toast("הנתונים עודכנו ממכשיר אחר");}
    else if(first&&!d){ // פעם ראשונה: העלאת נתונים שכבר נשמרו במכשיר
      loadLocal();if(S.notes.length+S.tx.length+S.suppliers.length)save();}
    first=false;setSync("מסונכרן");render();
  },err=>{setSync("אין גישה לנתונים");toast("אין גישה לנתונים. בדוק הרשאות.")});
}
async function addPhone(){const p=normPhone(v("newPhone"));if(p.length<11)return toast("מספר לא תקין");
  const phones=[...new Set([...(FB.access.phones||[]),p])];
  try{await firebase.firestore().doc("config/access").set({phones});FB.access.phones=phones;render();toast("המספר נוסף")}catch(e){toast("רק בעל העסק יכול להוסיף מספרים")}}
async function removePhone(p){if(!await ask("להסיר את "+prettyPhone(p)+"? הוא לא יוכל להיכנס יותר."))return;
  const phones=(FB.access.phones||[]).filter(x=>x!==p);
  try{await firebase.firestore().doc("config/access").set({phones});FB.access.phones=phones;render()}catch(e){toast("לא הצלחנו להסיר")}}


/* נגישות: מקלדת, תוויות ושמות לכפתורי אייקון */
function enhance(root){
  root.querySelectorAll("[onclick]:not(button):not(a):not(input):not(select):not(label)").forEach(el=>{
    if(el.dataset.a11y)return;el.dataset.a11y=1;el.setAttribute("role","button");el.tabIndex=0;
    if(el.classList.contains("chip"))el.setAttribute("aria-pressed",el.classList.contains("on")?"true":"false");
    el.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();el.click()}});
  });
  root.querySelectorAll("svg").forEach(v=>v.setAttribute("aria-hidden","true"));
  root.querySelectorAll("button").forEach(b=>{if(!b.getAttribute("aria-label")&&b.textContent.trim()==="✕")b.setAttribute("aria-label","הסרה")});
  let n=0;root.querySelectorAll("label:not([for])").forEach(l=>{
    let c=l.nextElementSibling;if(c&&!/^(INPUT|SELECT|TEXTAREA)$/.test(c.tagName))c=c.querySelector&&c.querySelector("input,select,textarea");
    if(!c)c=l.querySelector("input,select,textarea");
    if(c&&c!==l.querySelector("input")){if(!c.id)c.id="f"+Date.now().toString(36)+(n++);l.htmlFor=c.id}
  });
  root.querySelectorAll("input:not([aria-label]),select:not([aria-label])").forEach(c=>{
    if(c.id&&root.querySelector(`label[for="${c.id}"]`))return;if(c.closest("label"))return;
    if(c.placeholder)c.setAttribute("aria-label",c.placeholder);
  });
}
new MutationObserver(()=>{enhance(document.getElementById("app"));enhance(document.getElementById("dlg"));enhance(document.getElementById("ask"))})
  .observe(document.body,{childList:true,subtree:true});

/* ============ הפעלה ============ */
if(FB.cfg){renderTabs();fbStart()}else{loadLocal();render();initCloud()}
